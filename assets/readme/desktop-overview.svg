<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">Oh My Desktop — два экрана, одна удобная система</title>
  <desc id="description">Иллюстрация прозрачного рабочего стола: папки на левом мониторе, ярлыки и меню на правом. Фиолетовое оформление с бирюзовыми акцентами.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111525"/><stop offset="1" stop-color="#19152d"/></linearGradient>
    <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#222344"/><stop offset=".55" stop-color="#37305e"/><stop offset="1" stop-color="#192e43"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#c2b5ff"/><stop offset="1" stop-color="#72dccb"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7661ca" stop-opacity=".35"/><stop offset="1" stop-color="#7661ca" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b7a4ff" opacity=".12"/></pattern>
    <g id="folder"><path d="M0 9a5 5 0 0 1 5-5h15l6 6h25a5 5 0 0 1 5 5v27a5 5 0 0 1-5 5H5a5 5 0 0 1-5-5Z" fill="#9d8ce7"/><path d="M0 17a5 5 0 0 1 5-5h46a5 5 0 0 1 5 5v25a5 5 0 0 1-5 5H5a5 5 0 0 1-5-5Z" fill="#c5b8ff"/><path d="M5 18h46" stroke="#e4dcff" stroke-opacity=".45"/></g>
    <g id="document"><rect width="36" height="46" rx="5" fill="#e0def1"/><path d="M24 0v12h12" fill="#b5add5"/><path d="M9 23h18M9 30h18M9 37h11" stroke="#81759e" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
